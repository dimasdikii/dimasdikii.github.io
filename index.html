<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://dimasdiki.id">
    <title>Dimas Diki</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="icon" href="https://dimasdiki.id/img/dimasdiki-logo.png" type="image/png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF5E5B',
                        secondary: '#00CECB',
                        accent: '#FFED66',
                        dark: '#2D3047',
                        light: '#FDFFFC'
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace']
                    },
                    boxShadow: {
                        'neo': '8px 8px 0px 0px rgba(0,0,0,1)',
                        'neo-sm': '4px 4px 0px 0px rgba(0,0,0,1)',
                        'neo-hover': '12px 12px 0px 0px rgba(0,0,0,1)'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
</head>
<body class="bg-accent min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-2xl w-full">
        <div class="bg-light border-2 border-dark p-8 shadow-neo transition-all hover:shadow-neo-hover">
            <div class="flex flex-col md:flex-row gap-8 items-center">
                <div class="w-32 h-32 md:w-40 md:h-40 border-2 border-dark bg-primary flex items-center justify-center shadow-neo-sm">
                    <img src="https://dimasdiki.id/img/dimasdiki-logo.png" alt="Dimas Diki" class="w-full h-full object-contain">
                </div>
                
                <div class="flex-1">
                    <h1 class="text-4xl md:text-5xl font-bold text-dark mb-2">DIMAS DIKI</h1>
                    <p class="text-lg md:text-xl text-dark mb-6">Pranata Komputer & Web Programmer</p>
                    
                    <div class="flex flex-wrap gap-3 mb-8">
                        <a href="https://instagram.com/dimasdikii" class="bg-secondary px-4 py-2 border-2 border-dark shadow-neo-sm hover:shadow-neo transition-all text-dark font-medium flex items-center gap-2">
                            <i data-feather="instagram"></i> Instagram
                        </a>
                        <a href="https://dimasdiki.id" class="bg-primary px-4 py-2 border-2 border-dark shadow-neo-sm hover:shadow-neo transition-all text-light font-medium flex items-center gap-2">
                            <i data-feather="link"></i> Portfolio
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-8 border-t-2 border-dark pt-6">
                <p class="text-dark">Anda akan diarahkan ke halaman utama <a href="https://dimasdiki.id" class="text-primary underline">https://dimasdiki.id</a> dalam <span id="countdown" class="font-bold text-primary">5</span> detik</p>
                <div class="mt-4">
                    <div class="bg-dark h-2 border-2 border-dark">
                        <div id="progressBar" class="bg-primary h-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 border-t-2 border-dark pt-6">
                <h2 class="text-2xl font-bold text-dark mb-4">Contact</h2>
                <div class="flex flex-wrap gap-4">
                    <a href="mailto:admin@dimasdiki.id" class="bg-dark px-4 py-2 border-2 border-dark shadow-neo-sm hover:shadow-neo transition-all text-light font-medium flex items-center gap-2">
                        <i data-feather="mail"></i> Email
                    </a>
                    <a href="https://wa.me/6287717088885" class="bg-light px-4 py-2 border-2 border-dark shadow-neo-sm hover:shadow-neo transition-all text-dark font-medium flex items-center gap-2">
                        <i data-feather="message-square"></i> WhatsApp
                    </a>
                </div>
            </div>
        </div>
        
        <div class="mt-6 text-center text-dark">
            <p class="font-mono text-sm">© 2025 Dimas Diki. All rights reserved.</p>
        </div>
    </div>
    
    <script>
        feather.replace();
        
        let timeLeft = 5;
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        
        function updateCountdown() {
            countdownElement.textContent = timeLeft;
            progressBar.style.width = (timeLeft / 5 * 100) + '%';
            
            if (timeLeft > 0) {
                timeLeft--;
                setTimeout(updateCountdown, 1000);
            } else {
                window.location.href = 'https://dimasdiki.id';
            }
        }
        
        setTimeout(updateCountdown, 1000);
    </script>
</body>
</html>
